server:
  port: 9091

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/prompt_fuzzer?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null

promptfuzzer:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY}
    model: qwen-plus
  executor:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 100
  oob:
    dnslog:
      enabled: true
      base-url: https://dnslog.org
      poll-timeout-ms: 15000
      poll-interval-ms: 3000
      fallback-url: ${OOB_FALLBACK_URL:http://127.0.0.1:18081/pfz-oob}

agent:
  workflow:
    trace:
      enabled: true
